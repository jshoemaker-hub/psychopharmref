{{- /* Hide scheduled (future-dated) newsroom items until their publish day, in the reader's time zone. */ -}}
<script>
(function () {
  var d = new Date();
  var today = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  document.querySelectorAll('[data-nw-dated] [data-date]').forEach(function (el) {
    if (el.getAttribute('data-date') > today) el.remove();
  });
  document.querySelectorAll('[data-nw-dated]').forEach(function (list) {
    if (!list.querySelector('[data-date]')) { var s = list.closest('section'); if (s) s.remove(); }
  });
})();
</script>
