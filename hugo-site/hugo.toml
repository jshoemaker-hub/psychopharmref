baseURL = "https://psychopharmref.com"
languageCode = "en-us"
title = "PsychoPharmRef — Psychopharmacology Reference for Clinicians"
defaultContentLanguage = "en"
# Newsroom pieces are scheduled by their `date`; build them all and let the
# home page / archive reveal each one on its publish day (js/newsroom.js).
buildFuture = true
# No content uses the categories/tags taxonomies, and there are no templates for them,
# so /categories/ and /tags/ were 404s listed in the sitemap. Disable those page kinds.
disableKinds = ["taxonomy", "term"]

[params]
  description = "Free clinical psychopharmacology reference with 101 medications, receptor binding profiles, P450 interactions, 60+ clinical tools, and 120+ evidence-based chapters."
  author = "Jerad Shoemaker, MD"
  authorJobTitle = "Psychiatrist"
  ga4ID = "G-RK6J3FQ9L7"
  medCount = 101

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true

[minify]
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepEndTags = true
      keepWhitespace = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[taxonomies]
  category = "categories"
  tag = "tags"
