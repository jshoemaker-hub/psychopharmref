<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Stylized blood-brain barrier as a horizontal wall: above it a green agonist activates a muscarinic receptor inside a brain outline; below it amber blockers cap receptors on simplified gut and bladder shapes.">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#6b6050" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" fill="#f4efe6"/>
  <rect y="340" width="1200" height="335" fill="#e2d9c8"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <!-- brain outline -->
  <path d="M470 290 C390 290 360 230 385 190 C360 140 400 90 455 98 C470 55 540 45 580 75 C620 40 700 50 720 95 C780 85 830 135 810 185 C840 225 810 290 740 290 Z" fill="#ece6db" stroke="#231e14" stroke-width="6"/>
  <path d="M520 120 q30 30 0 60 M640 110 q-25 35 10 70 M720 170 q-40 10 -50 50 M450 190 q40 -5 55 40" fill="none" stroke="#6b6050" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <!-- central receptor activated -->
  <g stroke="#231e14" stroke-width="5">
    <path d="M565 280 v-70 a35 35 0 0 1 70 0 v70 z" fill="#9fb88f"/>
    <circle cx="600" cy="196" r="24" fill="#4a7c35"/>
  </g>
  <g stroke="#4a7c35" stroke-width="7" stroke-linecap="round">
    <line x1="545" y1="160" x2="520" y2="140"/><line x1="655" y1="160" x2="680" y2="140"/><line x1="600" y1="150" x2="600" y2="120"/>
  </g>
  <text x="652" y="262" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#231e14">M1/M4</text>
  <!-- barrier wall -->
  <g fill="#c9a24a" stroke="#231e14" stroke-width="4">
    <rect x="0" y="318" width="150" height="44"/><rect x="150" y="318" width="150" height="44"/><rect x="300" y="318" width="150" height="44"/><rect x="450" y="318" width="150" height="44"/><rect x="600" y="318" width="150" height="44"/><rect x="750" y="318" width="150" height="44"/><rect x="900" y="318" width="150" height="44"/><rect x="1050" y="318" width="150" height="44"/>
  </g>
  <!-- trospium bouncing off wall -->
  <g stroke="#231e14" stroke-width="4" fill="#d98b5f">
    <rect x="330" y="380" width="44" height="26" rx="13"/><rect x="820" y="384" width="44" height="26" rx="13"/>
  </g>
  <path d="M352 380 q10 -14 26 -4 M842 384 q10 -14 26 -4" fill="none" stroke="#6b6050" stroke-width="3"/>
  <!-- gut -->
  <path d="M260 460 h170 a40 40 0 0 1 0 80 h-130 a30 30 0 0 0 0 60 h170" fill="none" stroke="#231e14" stroke-width="30" stroke-linecap="round"/>
  <path d="M260 460 h170 a40 40 0 0 1 0 80 h-130 a30 30 0 0 0 0 60 h170" fill="none" stroke="#ece6db" stroke-width="20" stroke-linecap="round"/>
  <!-- bladder -->
  <path d="M780 450 C700 450 690 560 760 600 L800 625 L840 600 C910 560 900 450 820 450 Z" fill="#ece6db" stroke="#231e14" stroke-width="6"/>
  <!-- peripheral receptors capped -->
  <g stroke="#231e14" stroke-width="4">
    <path d="M520 500 v-30 a22 22 0 0 1 44 0 v30 z" fill="#9fb88f"/>
    <rect x="514" y="440" width="56" height="22" rx="11" fill="#d98b5f"/>
    <path d="M960 500 v-30 a22 22 0 0 1 44 0 v30 z" fill="#9fb88f"/>
    <rect x="954" y="440" width="56" height="22" rx="11" fill="#d98b5f"/>
  </g>
</svg>
