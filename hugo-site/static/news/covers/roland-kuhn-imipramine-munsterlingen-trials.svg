<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A three-ring tricyclic molecule outline above a row of unlabeled pill bottles, beside the silhouette of a lakeside hospital building, symbolizing Roland Kuhn's discovery of imipramine at Münsterlingen.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#e2d9c8"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb88f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5b4a7a" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#6b6050" opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <!-- Lake band -->
  <rect x="0" y="470" width="1200" height="205" fill="url(#lake)"/>
  <g stroke="#f4efe6" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M80 540 H200 M300 600 H420 M820 560 H960 M1000 620 H1120"/>
  </g>
  <!-- Hospital silhouette (right) -->
  <g transform="translate(835 270) scale(0.95)" fill="#6b6050">
    <rect x="0" y="80" width="340" height="120"/>
    <path d="M-10 84 L60 30 H280 L350 84 Z" fill="#231e14"/>
    <rect x="150" y="0" width="40" height="80"/>
    <path d="M144 4 L170 -30 L196 4 Z" fill="#231e14"/>
    <g fill="#f4efe6" opacity="0.8">
      <rect x="24" y="104" width="22" height="32"/><rect x="70" y="104" width="22" height="32"/><rect x="116" y="104" width="22" height="32"/>
      <rect x="202" y="104" width="22" height="32"/><rect x="248" y="104" width="22" height="32"/><rect x="294" y="104" width="22" height="32"/>
      <rect x="24" y="152" width="22" height="32"/><rect x="70" y="152" width="22" height="32"/><rect x="294" y="152" width="22" height="32"/>
      <rect x="248" y="152" width="22" height="32"/><rect x="202" y="152" width="22" height="32"/>
    </g>
    <rect x="154" y="140" width="32" height="60" fill="#231e14"/>
  </g>
  <!-- Centre disc -->
  <circle cx="560" cy="300" r="250" fill="#ece6db"/>
  <circle cx="560" cy="300" r="250" fill="none" stroke="#5b4a7a" stroke-width="3" opacity="0.35"/>
  <!-- Tricyclic: hexagon - seven-ring - hexagon -->
  <g stroke="#5b4a7a" stroke-width="12" stroke-linejoin="round" fill="#f4efe6">
    <path d="M350 250 L396 224 L442 250 L442 302 L396 328 L350 302 Z"/>
    <path d="M678 250 L724 224 L770 250 L770 302 L724 328 L678 302 Z"/>
    <path d="M442 250 L510 212 L610 212 L678 250 L678 302 L560 360 L442 302 Z"/>
  </g>
  <circle cx="560" cy="360" r="20" fill="#c9a24a" stroke="#231e14" stroke-width="5"/>
  <path d="M560 380 V430 L610 458 V490" stroke="#231e14" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pill bottles (left foreground) -->
  <g transform="translate(140 400)">
    <g>
      <rect x="0" y="20" width="70" height="120" rx="8" fill="#d98b5f" stroke="#231e14" stroke-width="5"/>
      <rect x="6" y="0" width="58" height="24" rx="4" fill="#231e14"/>
      <rect x="10" y="60" width="50" height="40" fill="#f4efe6"/>
    </g>
    <g transform="translate(90 0)">
      <rect x="0" y="20" width="70" height="120" rx="8" fill="#c9a24a" stroke="#231e14" stroke-width="5"/>
      <rect x="6" y="0" width="58" height="24" rx="4" fill="#231e14"/>
      <rect x="10" y="60" width="50" height="40" fill="#f4efe6"/>
    </g>
    <g transform="translate(180 0)">
      <rect x="0" y="20" width="70" height="120" rx="8" fill="#9fb88f" stroke="#231e14" stroke-width="5"/>
      <rect x="6" y="0" width="58" height="24" rx="4" fill="#231e14"/>
      <rect x="10" y="60" width="50" height="40" fill="#f4efe6"/>
    </g>
  </g>
  <path d="M100 545 H1100" stroke="#231e14" stroke-width="6" stroke-linecap="round"/>
</svg>
