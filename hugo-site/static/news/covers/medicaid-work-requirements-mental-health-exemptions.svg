<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A Medicaid card clipped to a clipboard beside a monthly timesheet grid and a stethoscope curving into a checkmark.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#e2d9c8"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#6b6050" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <rect x="0" y="575" width="1200" height="100" fill="#6b6050" opacity="0.16"/>
  <circle cx="600" cy="340" r="270" fill="#ece6db"/>
  <!-- clipboard -->
  <rect x="330" y="140" width="330" height="430" rx="18" fill="#6b6050"/>
  <rect x="352" y="170" width="286" height="380" rx="8" fill="#ffffff"/>
  <rect x="435" y="120" width="120" height="50" rx="10" fill="#231e14"/>
  <rect x="460" y="132" width="70" height="14" rx="7" fill="#c9a24a"/>
  <!-- timesheet grid -->
  <g fill="none" stroke="#231e14" stroke-width="3">
    <rect x="378" y="300" width="234" height="220"/>
    <path d="M378 344 H612 M378 388 H612 M378 432 H612 M378 476 H612 M456 300 V520 M534 300 V520"/>
  </g>
  <g fill="#9fb88f">
    <rect x="381" y="303" width="72" height="38"/>
    <rect x="459" y="347" width="72" height="38"/>
    <rect x="537" y="303" width="72" height="38"/>
    <rect x="381" y="391" width="72" height="38"/>
  </g>
  <rect x="537" y="435" width="72" height="38" fill="#d98b5f"/>
  <rect x="459" y="479" width="72" height="38" fill="#d98b5f"/>
  <!-- card -->
  <g transform="rotate(-6 495 235)">
    <rect x="380" y="180" width="230" height="110" rx="12" fill="#8a3b2e"/>
    <rect x="400" y="202" width="46" height="34" rx="5" fill="#c9a24a"/>
    <rect x="460" y="208" width="120" height="10" rx="5" fill="#f4efe6" opacity="0.9"/>
    <rect x="460" y="228" width="90" height="10" rx="5" fill="#f4efe6" opacity="0.6"/>
    <rect x="400" y="256" width="180" height="10" rx="5" fill="#f4efe6" opacity="0.6"/>
  </g>
  <!-- stethoscope checkmark -->
  <path d="M720 330 L800 420 L960 210" fill="none" stroke="#231e14" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M960 210 q30 -40 0 -80" fill="none" stroke="#231e14" stroke-width="10" stroke-linecap="round"/>
  <circle cx="720" cy="330" r="34" fill="#8a3b2e" stroke="#231e14" stroke-width="8"/>
  <circle cx="720" cy="330" r="12" fill="#ece6db"/>
  <circle cx="948" cy="126" r="10" fill="#231e14"/>
  <circle cx="985" cy="140" r="10" fill="#231e14"/>
  <path d="M960 130 q12 -8 25 10" fill="none" stroke="#231e14" stroke-width="8"/>
  <!-- calendar dot motif -->
  <g fill="#c9a24a">
    <circle cx="200" cy="200" r="16"/><circle cx="244" cy="200" r="16" opacity="0.6"/><circle cx="288" cy="200" r="16" opacity="0.35"/>
    <circle cx="200" cy="244" r="16" opacity="0.6"/><circle cx="244" cy="244" r="16" opacity="0.35"/>
  </g>
</svg>
