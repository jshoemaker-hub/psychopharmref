<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A subcutaneous syringe beside a monthly calendar page with one date circled, and a stopwatch crossed out.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#e2d9c8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#6b6050" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <circle cx="600" cy="338" r="250" fill="#ece6db"/>
  <circle cx="600" cy="338" r="250" fill="none" stroke="#2f6f8f" stroke-width="3" opacity="0.35"/>
  <!-- calendar -->
  <g transform="translate(420 170)">
    <rect x="8" y="10" width="300" height="320" rx="16" fill="#231e14" opacity="0.12"/>
    <rect width="300" height="320" rx="16" fill="#f4efe6" stroke="#231e14" stroke-width="5"/>
    <rect width="300" height="70" rx="16" fill="#2f6f8f"/>
    <rect y="50" width="300" height="20" fill="#2f6f8f"/>
    <rect x="60" y="-22" width="16" height="46" rx="8" fill="#231e14"/>
    <rect x="224" y="-22" width="16" height="46" rx="8" fill="#231e14"/>
    <g fill="#6b6050" opacity="0.45">
      <rect x="30" y="100" width="28" height="22" rx="4"/><rect x="80" y="100" width="28" height="22" rx="4"/><rect x="130" y="100" width="28" height="22" rx="4"/><rect x="180" y="100" width="28" height="22" rx="4"/><rect x="230" y="100" width="28" height="22" rx="4"/>
      <rect x="30" y="150" width="28" height="22" rx="4"/><rect x="80" y="150" width="28" height="22" rx="4"/><rect x="180" y="150" width="28" height="22" rx="4"/><rect x="230" y="150" width="28" height="22" rx="4"/>
      <rect x="30" y="200" width="28" height="22" rx="4"/><rect x="80" y="200" width="28" height="22" rx="4"/><rect x="130" y="200" width="28" height="22" rx="4"/><rect x="180" y="200" width="28" height="22" rx="4"/><rect x="230" y="200" width="28" height="22" rx="4"/>
      <rect x="30" y="250" width="28" height="22" rx="4"/><rect x="80" y="250" width="28" height="22" rx="4"/><rect x="130" y="250" width="28" height="22" rx="4"/><rect x="180" y="250" width="28" height="22" rx="4"/>
    </g>
    <rect x="130" y="150" width="28" height="22" rx="4" fill="#c9a24a"/>
    <circle cx="144" cy="161" r="30" fill="none" stroke="#2f6f8f" stroke-width="7"/>
  </g>
  <!-- syringe -->
  <g transform="translate(250 470) rotate(-35)">
    <rect x="0" y="-26" width="230" height="52" rx="10" fill="#f4efe6" stroke="#231e14" stroke-width="5"/>
    <rect x="70" y="-20" width="154" height="40" rx="6" fill="#2f6f8f" opacity="0.8"/>
    <g stroke="#231e14" stroke-width="3"><line x1="90" y1="-26" x2="90" y2="-8"/><line x1="120" y1="-26" x2="120" y2="-8"/><line x1="150" y1="-26" x2="150" y2="-8"/><line x1="180" y1="-26" x2="180" y2="-8"/></g>
    <rect x="-70" y="-8" width="72" height="16" fill="#231e14"/>
    <rect x="-86" y="-40" width="18" height="80" rx="5" fill="#231e14"/>
    <rect x="230" y="-12" width="22" height="24" fill="#6b6050"/>
    <polygon points="252,-3 330,0 252,3" fill="#231e14"/>
  </g>
  <!-- stopwatch crossed -->
  <g transform="translate(880 230)">
    <rect x="-14" y="-92" width="28" height="22" rx="4" fill="#231e14"/>
    <circle r="72" fill="#f4efe6" stroke="#231e14" stroke-width="6"/>
    <circle r="56" fill="none" stroke="#6b6050" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="-46" stroke="#231e14" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="34" y2="20" stroke="#231e14" stroke-width="6" stroke-linecap="round"/>
    <circle r="7" fill="#231e14"/>
    <line x1="-62" y1="62" x2="62" y2="-62" stroke="#d98b5f" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
