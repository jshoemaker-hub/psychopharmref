<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A fee schedule ledger page with a downward arrow on one column and upward arrows beside a therapy couch and a video-call screen.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#e2d9c8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#6b6050" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <circle cx="600" cy="340" r="270" fill="#ece6db"/>
  <rect x="0" y="575" width="1200" height="100" fill="#6b6050" opacity="0.18"/>
  <!-- ledger page -->
  <g transform="rotate(-3 600 340)">
    <rect x="380" y="110" width="440" height="460" rx="10" fill="#ffffff" stroke="#231e14" stroke-width="5"/>
    <rect x="380" y="110" width="440" height="66" rx="10" fill="#8a3b2e"/>
    <rect x="380" y="150" width="440" height="26" fill="#8a3b2e"/>
    <rect x="410" y="134" width="150" height="14" rx="7" fill="#f4efe6" opacity="0.85"/>
    <rect x="690" y="134" width="100" height="14" rx="7" fill="#f4efe6" opacity="0.6"/>
    <line x1="640" y1="176" x2="640" y2="570" stroke="#231e14" stroke-width="3" opacity="0.35"/>
    <g fill="#6b6050" opacity="0.45">
      <rect x="410" y="210" width="190" height="10" rx="5"/>
      <rect x="410" y="258" width="160" height="10" rx="5"/>
      <rect x="410" y="306" width="200" height="10" rx="5"/>
      <rect x="410" y="354" width="150" height="10" rx="5"/>
      <rect x="410" y="402" width="180" height="10" rx="5"/>
      <rect x="410" y="450" width="170" height="10" rx="5"/>
      <rect x="410" y="498" width="140" height="10" rx="5"/>
    </g>
    <g stroke="#231e14" stroke-width="2" opacity="0.15">
      <line x1="400" y1="236" x2="800" y2="236"/>
      <line x1="400" y1="284" x2="800" y2="284"/>
      <line x1="400" y1="332" x2="800" y2="332"/>
      <line x1="400" y1="380" x2="800" y2="380"/>
      <line x1="400" y1="428" x2="800" y2="428"/>
      <line x1="400" y1="476" x2="800" y2="476"/>
      <line x1="400" y1="524" x2="800" y2="524"/>
    </g>
    <!-- down arrow in value column -->
    <path d="M730 210 v170" stroke="#8a3b2e" stroke-width="22" stroke-linecap="round"/>
    <path d="M685 360 L730 425 L775 360 Z" fill="#8a3b2e"/>
    <circle cx="730" cy="490" r="26" fill="#c9a24a"/>
    <circle cx="730" cy="490" r="14" fill="none" stroke="#231e14" stroke-width="4"/>
  </g>
  <!-- therapy couch, left -->
  <g transform="translate(40 0)">
    <path d="M110 420 h190 a24 24 0 0 1 24 24 v40 h-238 v-40 a24 24 0 0 1 24 -24 Z" fill="#8a3b2e"/>
    <path d="M86 450 a30 30 0 0 1 30 -30 h10 v64 h-40 Z" fill="#6b6050"/>
    <rect x="130" y="398" width="70" height="30" rx="14" fill="#d98b5f"/>
    <rect x="96" y="484" width="16" height="34" rx="4" fill="#231e14"/>
    <rect x="300" y="484" width="16" height="34" rx="4" fill="#231e14"/>
    <path d="M205 360 v-110" stroke="#4a7c35" stroke-width="18" stroke-linecap="round"/>
    <path d="M170 270 L205 220 L240 270 Z" fill="#4a7c35"/>
  </g>
  <!-- video call screen, right -->
  <g transform="translate(-35 0)">
    <rect x="880" y="360" width="220" height="150" rx="12" fill="#231e14"/>
    <rect x="894" y="374" width="192" height="122" rx="6" fill="#9fb88f"/>
    <circle cx="990" cy="420" r="22" fill="#f4efe6"/>
    <path d="M950 496 a40 34 0 0 1 80 0 Z" fill="#f4efe6"/>
    <rect x="960" y="510" width="60" height="18" fill="#6b6050"/>
    <rect x="930" y="526" width="120" height="10" rx="5" fill="#6b6050"/>
    <path d="M990 330 v-110" stroke="#4a7c35" stroke-width="18" stroke-linecap="round"/>
    <path d="M955 240 L990 190 L1025 240 Z" fill="#4a7c35"/>
  </g>
</svg>
