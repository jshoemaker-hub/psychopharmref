<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Stylized synapse: a presynaptic terminal with three reuptake transporters, the largest blocked by a green capsule, and neurotransmitter dots filling the synaptic cleft.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#e2d9c8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#6b6050" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <!-- presynaptic terminal -->
  <path d="M250 0 H950 V215 Q950 300 860 300 H340 Q250 300 250 215 Z" fill="#ece6db" stroke="#231e14" stroke-width="6"/>
  <!-- vesicles -->
  <g fill="#f4efe6" stroke="#6b6050" stroke-width="4">
    <circle cx="400" cy="120" r="34"/><circle cx="520" cy="80" r="30"/><circle cx="690" cy="110" r="34"/><circle cx="810" cy="75" r="28"/>
  </g>
  <g fill="#c9a24a"><circle cx="392" cy="112" r="6"/><circle cx="410" cy="128" r="6"/><circle cx="520" cy="80" r="6"/><circle cx="684" cy="104" r="6"/><circle cx="700" cy="120" r="6"/><circle cx="810" cy="75" r="6"/></g>
  <!-- postsynaptic -->
  <path d="M250 675 V470 Q250 400 340 400 H860 Q950 400 950 470 V675 Z" fill="#9fb88f" opacity="0.55" stroke="#231e14" stroke-width="6"/>
  <g fill="#4a7c35" stroke="#231e14" stroke-width="3">
    <path d="M380 400 v-20 a14 14 0 0 1 28 0 v20 z"/><path d="M560 400 v-20 a14 14 0 0 1 28 0 v20 z"/><path d="M740 400 v-20 a14 14 0 0 1 28 0 v20 z"/><path d="M830 400 v-20 a14 14 0 0 1 28 0 v20 z"/>
  </g>
  <!-- transmitter in cleft -->
  <g fill="#c9a24a">
    <circle cx="330" cy="345" r="8"/><circle cx="455" cy="360" r="8"/><circle cx="500" cy="330" r="8"/><circle cx="640" cy="355" r="8"/><circle cx="700" cy="330" r="8"/><circle cx="880" cy="350" r="8"/><circle cx="790" cy="365" r="8"/><circle cx="600" cy="378" r="7"/>
  </g>
  <g fill="#d98b5f"><circle cx="420" cy="335" r="7"/><circle cx="745" cy="350" r="7"/></g>
  <!-- transporters (NET large, DAT medium, SERT small) -->
  <g stroke="#231e14" stroke-width="5">
    <rect x="330" y="250" width="44" height="90" rx="14" fill="#6b6050"/>
    <rect x="384" y="250" width="44" height="90" rx="14" fill="#6b6050"/>
    <rect x="560" y="262" width="36" height="72" rx="12" fill="#8b7d68"/>
    <rect x="604" y="262" width="36" height="72" rx="12" fill="#8b7d68"/>
    <rect x="800" y="270" width="28" height="58" rx="10" fill="#a89a82"/>
    <rect x="834" y="270" width="28" height="58" rx="10" fill="#a89a82"/>
  </g>
  <!-- inhibitor capsules -->
  <g stroke="#231e14" stroke-width="5">
    <rect x="336" y="304" width="86" height="46" rx="23" fill="#4a7c35"/>
    <rect x="568" y="306" width="64" height="34" rx="17" fill="#4a7c35" opacity="0.8"/>
    <rect x="806" y="306" width="50" height="26" rx="13" fill="#4a7c35" opacity="0.6"/>
  </g>
  <line x1="379" y1="304" x2="379" y2="350" stroke="#231e14" stroke-width="4"/>
  <g font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#231e14" text-anchor="middle">
    <text x="379" y="236" font-size="30">NET</text>
    <text x="600" y="248" font-size="24">DAT</text>
    <text x="831" y="258" font-size="20">SERT</text>
  </g>
</svg>
