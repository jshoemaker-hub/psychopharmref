<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A green kratom leaf on one side of a dashed measuring line and a small vial and tablet on the other, with a stamped calendar date above.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#e2d9c8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#6b6050" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <circle cx="600" cy="350" r="255" fill="#ece6db"/>
  <circle cx="600" cy="350" r="255" fill="none" stroke="#2f6f8f" stroke-width="3" opacity="0.35"/>
  <!-- threshold line -->
  <line x1="600" y1="120" x2="600" y2="590" stroke="#2f6f8f" stroke-width="6" stroke-dasharray="18 14"/>
  <g fill="#2f6f8f"><rect x="575" y="200" width="50" height="6"/><rect x="583" y="280" width="34" height="6"/><rect x="575" y="360" width="50" height="6"/><rect x="583" y="440" width="34" height="6"/><rect x="575" y="520" width="50" height="6"/></g>
  <!-- leaf -->
  <g transform="translate(430 370) rotate(-28)">
    <path d="M0 -170 C 95 -110 105 60 0 170 C -105 60 -95 -110 0 -170 Z" fill="#9fb88f" stroke="#231e14" stroke-width="5"/>
    <path d="M0 -150 L0 210" stroke="#8a3b2e" stroke-width="7" stroke-linecap="round"/>
    <g stroke="#231e14" stroke-width="3" opacity="0.55" fill="none">
      <path d="M0 -100 L50 -130"/><path d="M0 -100 L-50 -130"/>
      <path d="M0 -40 L62 -75"/><path d="M0 -40 L-62 -75"/>
      <path d="M0 20 L64 -12"/><path d="M0 20 L-64 -12"/>
      <path d="M0 80 L52 52"/><path d="M0 80 L-52 52"/>
    </g>
  </g>
  <!-- vial -->
  <g transform="translate(700 260)">
    <rect x="8" y="14" width="96" height="220" rx="16" fill="#231e14" opacity="0.12"/>
    <rect x="0" y="0" width="96" height="40" rx="8" fill="#231e14"/>
    <rect x="6" y="36" width="84" height="190" rx="14" fill="#f4efe6" stroke="#231e14" stroke-width="5"/>
    <rect x="12" y="110" width="72" height="110" rx="10" fill="#d98b5f"/>
    <rect x="20" y="70" width="56" height="30" rx="4" fill="#ece6db" stroke="#6b6050" stroke-width="2"/>
  </g>
  <!-- tablet -->
  <g transform="translate(860 450)">
    <ellipse cx="6" cy="10" rx="62" ry="38" fill="#231e14" opacity="0.12"/>
    <ellipse cx="0" cy="0" rx="62" ry="38" fill="#c9a24a" stroke="#231e14" stroke-width="5"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#231e14" stroke-width="4"/>
  </g>
  <!-- calendar stamp -->
  <g transform="translate(780 110) rotate(8)">
    <rect x="0" y="0" width="150" height="130" rx="12" fill="#f4efe6" stroke="#231e14" stroke-width="5"/>
    <rect x="0" y="0" width="150" height="38" rx="12" fill="#2f6f8f"/>
    <rect x="0" y="26" width="150" height="12" fill="#2f6f8f"/>
    <text x="75" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="bold" fill="#231e14">13</text>
  </g>
  <g transform="translate(160 120)" fill="#6b6050" opacity="0.3">
    <circle cx="0" cy="0" r="10"/><circle cx="40" cy="20" r="6"/><circle cx="10" cy="50" r="7"/>
  </g>
</svg>
