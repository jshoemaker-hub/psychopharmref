[build]
  base = "hugo-site"
  command = "hugo --minify"
  publish = "hugo-site/public"

[build.environment]
  HUGO_VERSION = "0.140.0"

[context.production.environment]
  HUGO_ENV = "production"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-UA-Compatible = "IE=edge"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://rqvulyfzyyvzxekuxgyu.supabase.co wss://rqvulyfzyyvzxekuxgyu.supabase.co https://formspree.io https://cdn.jsdelivr.net; frame-src https://www.youtube-nocookie.com https://blog-comments-peach.vercel.app; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Section markup the app loads on demand; not standalone pages
[[headers]]
  for = "/fragments/*"
  [headers.values]
    X-Robots-Tag = "noindex"
